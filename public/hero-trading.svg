<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Forex and gold trading candles illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1120"/>
      <stop offset="0.55" stop-color="#0e1a30"/>
      <stop offset="1" stop-color="#111f38"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5c451"/>
      <stop offset="1" stop-color="#d9962e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <g opacity="0.35" stroke="#2a4470" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
  </g>
  <!-- green bullish candles -->
  <g>
    <line x1="120" y1="380" x2="120" y2="500" stroke="#26a869" stroke-width="4"/>
    <rect x="102" y="400" width="36" height="72" rx="4" fill="#26a869"/>
    <line x1="240" y1="340" x2="240" y2="460" stroke="#26a869" stroke-width="4"/>
    <rect x="222" y="360" width="36" height="78" rx="4" fill="#26a869"/>
    <line x1="360" y1="300" x2="360" y2="430" stroke="#26a869" stroke-width="4"/>
    <rect x="342" y="322" width="36" height="84" rx="4" fill="#26a869"/>
    <line x1="600" y1="230" x2="600" y2="370" stroke="#26a869" stroke-width="4"/>
    <rect x="582" y="255" width="36" height="88" rx="4" fill="#26a869"/>
    <line x1="720" y1="190" x2="720" y2="330" stroke="#26a869" stroke-width="4"/>
    <rect x="702" y="215" width="36" height="90" rx="4" fill="#26a869"/>
    <line x1="840" y1="150" x2="840" y2="300" stroke="#26a869" stroke-width="4"/>
    <rect x="822" y="175" width="36" height="96" rx="4" fill="#26a869"/>
    <line x1="1000" y1="100" x2="1000" y2="260" stroke="#26a869" stroke-width="4"/>
    <rect x="982" y="128" width="36" height="100" rx="4" fill="#26a869"/>
  </g>
  <!-- red bearish candles -->
  <g>
    <line x1="180" y1="360" x2="180" y2="470" stroke="#e05260" stroke-width="4"/>
    <rect x="162" y="380" width="36" height="60" rx="4" fill="#e05260"/>
    <line x1="300" y1="300" x2="300" y2="420" stroke="#e05260" stroke-width="4"/>
    <rect x="282" y="325" width="36" height="68" rx="4" fill="#e05260"/>
    <line x1="480" y1="240" x2="480" y2="380" stroke="#e05260" stroke-width="4"/>
    <rect x="462" y="270" width="36" height="78" rx="4" fill="#e05260"/>
    <line x1="660" y1="180" x2="660" y2="320" stroke="#e05260" stroke-width="4"/>
    <rect x="642" y="212" width="36" height="82" rx="4" fill="#e05260"/>
    <line x1="900" y1="120 " x2="900" y2="270" stroke="#e05260" stroke-width="4"/>
    <rect x="882" y="150" width="36" height="90" rx="4" fill="#e05260"/>
  </g>
  <!-- gold XAUUSD candle emphasized -->
  <g>
    <line x1="1080" y1="70" x2="1080" y2="230" stroke="url(#gold)" stroke-width="6"/>
    <rect x="1058" y="95" width="44" height="108" rx="6" fill="url(#gold)"/>
    <circle cx="1080" cy="52" r="10" fill="#f5c451" opacity="0.5"/>
  </g>
  <!-- server rack motif bottom-left -->
  <g opacity="0.9">
    <rect x="60" y="60" width="150" height="200" rx="10" fill="#101c33" stroke="#2a4470" stroke-width="2"/>
    <g stroke="#26a869" stroke-width="3" stroke-linecap="round">
      <line x1="80" y1="95" x2="120" y2="95"/>
      <line x1="80" y1="140" x2="110" y2="140"/>
      <line x1="80" y1="185" x2="125" y2="185"/>
    </g>
    <g fill="#2a4470">
      <circle cx="185" cy="95" r="5"/>
      <circle cx="185" cy="140" r="5"/>
      <circle cx="185" cy="185" r="5"/>
    </g>
    <rect x="80" y="215" width="110" height="12" rx="3" fill="#1a2c4e"/>
  </g>
  <!-- grid label -->
  <text x="62" y="308" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#7f9cc9">XAUUSD · M15 · 24/5</text>
</svg>
