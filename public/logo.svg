<svg xmlns="http://www.w3.org/2000/svg" width="480" height="120" viewBox="0 0 480 120" fill="none">
  <defs>
    <linearGradient id="tnmark" x1="0" y1="0" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C8DFF"/>
      <stop offset="1" stop-color="#74B3FF"/>
    </linearGradient>
    <linearGradient id="tnglow" x1="0" y1="0" x2="480" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C8DFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#4C8DFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4C8DFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="480" height="120" rx="16" fill="#0C1322"/>
  <rect width="480" height="120" rx="16" fill="url(#tnglow)"/>
  <!-- Node mark: hexagon server with connecting circuit lines -->
  <g transform="translate(18,18)">
    <path d="M35 4 L64 21 V58 L35 75 L6 58 V21 Z" fill="none" stroke="url(#tnmark)" stroke-width="2.5"/>
    <circle cx="35" cy="24" r="5" fill="#4C8DFF"/>
    <circle cx="24" cy="45" r="5" fill="#74B3FF"/>
    <circle cx="46" cy="45" r="5" fill="#74B3FF"/>
    <path d="M35 29 L24 40" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M35 29 L46 40" stroke="#4C8DFF" stroke-width="2" stroke-linecap="round"/>
    <path d="M24 50 L24 56 M46 50 L46 56" stroke="#74B3FF" stroke-width="2" stroke-linecap="round"/>
  </g>
  <!-- Wordmark -->
  <text x="112" y="56" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="800" fill="#F4F8FD" letter-spacing="-0.5">TradeNode</text>
  <text x="112" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="30" font-weight="800" fill="#4C8DFF" letter-spacing="-0.5">VPS</text>
  <text x="230" y="90" font-family="Segoe UI, system-ui, sans-serif" font-size="14" fill="#8EA1BD">for traders</text>
</svg>
